services:
  0xbin:
    build: .
    ports:
      - "${OXBIN_HOST_BIND:-127.0.0.1}:8080:8080"
    environment:
      OXBIN_BASE_URL: ${OXBIN_BASE_URL:-http://localhost:8080}
      OXBIN_MAX_PASTE_BYTES: ${OXBIN_MAX_PASTE_BYTES:-1048576}
      OXBIN_DEFAULT_EXPIRY: ${OXBIN_DEFAULT_EXPIRY:-24h}
      OXBIN_ALLOWED_EXPIRIES: ${OXBIN_ALLOWED_EXPIRIES:-1h,24h,72h}
      OXBIN_CREATE_RATE: ${OXBIN_CREATE_RATE:-15/1h}
      OXBIN_READ_RATE: ${OXBIN_READ_RATE:-120/1h}
      OXBIN_MISS_RATE: ${OXBIN_MISS_RATE:-30/1h}
      OXBIN_CONSUME_RATE: ${OXBIN_CONSUME_RATE:-30/1h}
      OXBIN_TRUSTED_PROXIES: ${OXBIN_TRUSTED_PROXIES:-}
      OXBIN_CREATION_ENABLED: ${OXBIN_CREATION_ENABLED:-true}
      OXBIN_READ_HEADER_TIMEOUT: ${OXBIN_READ_HEADER_TIMEOUT:-5s}
      OXBIN_READ_TIMEOUT: ${OXBIN_READ_TIMEOUT:-15s}
      OXBIN_WRITE_TIMEOUT: ${OXBIN_WRITE_TIMEOUT:-30s}
      OXBIN_IDLE_TIMEOUT: ${OXBIN_IDLE_TIMEOUT:-60s}
      OXBIN_SHUTDOWN_TIMEOUT: ${OXBIN_SHUTDOWN_TIMEOUT:-10s}
      OXBIN_LIVE_ENABLED: ${OXBIN_LIVE_ENABLED:-true}
      OXBIN_LIVE_ROOM_LIFETIME: ${OXBIN_LIVE_ROOM_LIFETIME:-24h}
      OXBIN_LIVE_MAX_TABS: ${OXBIN_LIVE_MAX_TABS:-8}
      OXBIN_LIVE_MAX_BYTES: ${OXBIN_LIVE_MAX_BYTES:-1048576}
      OXBIN_LIVE_MAX_WRITERS: ${OXBIN_LIVE_MAX_WRITERS:-10}
      OXBIN_LIVE_MAX_VIEWERS: ${OXBIN_LIVE_MAX_VIEWERS:-100}
      OXBIN_LIVE_MAX_PARTICIPANTS: ${OXBIN_LIVE_MAX_PARTICIPANTS:-110}
      OXBIN_LIVE_MAX_MESSAGE_BYTES: ${OXBIN_LIVE_MAX_MESSAGE_BYTES:-65536}
      OXBIN_LIVE_HEARTBEAT_INTERVAL: ${OXBIN_LIVE_HEARTBEAT_INTERVAL:-20s}
      OXBIN_LIVE_RECONNECT_GRACE: ${OXBIN_LIVE_RECONNECT_GRACE:-30s}
      OXBIN_LIVE_PARTICIPANT_TIMEOUT: ${OXBIN_LIVE_PARTICIPANT_TIMEOUT:-60s}
      OXBIN_LIVE_CREATE_RATE: ${OXBIN_LIVE_CREATE_RATE:-10/1h}
      OXBIN_LIVE_UNLOCK_RATE: ${OXBIN_LIVE_UNLOCK_RATE:-10/15m}
      OXBIN_LIVE_CONNECTION_RATE: ${OXBIN_LIVE_CONNECTION_RATE:-60/1m}
      OXBIN_LIVE_MESSAGE_RATE: ${OXBIN_LIVE_MESSAGE_RATE:-2400/1m}
      OXBIN_LIVE_MAX_CONNECTIONS: ${OXBIN_LIVE_MAX_CONNECTIONS:-1000}
      OXBIN_LIVE_SNAPSHOT_LIMITS: ${OXBIN_LIVE_SNAPSHOT_LIMITS:-1000/4194304}
    volumes:
      - 0xbin-data:/data
    restart: unless-stopped

volumes:
  0xbin-data:
