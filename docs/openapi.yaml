openapi: 3.1.0
info:
  title: 0xbin API
  version: 0.1.0
  description: API for plaintext and encrypted pastes.
paths:
  /api/v1/pastes:
    post:
      summary: Create a plaintext or encrypted paste
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePasteRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePasteResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/pastes/{slug}:
    get:
      summary: Retrieve an active paste
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Active paste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteResponse'
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/pastes/{slug}/consume:
    post:
      summary: Reveal and atomically destroy an active burn-after-read paste
      description: For encrypted pastes, this consumes the ciphertext before the browser can verify a supplied key. A wrong or missing key cannot be retried after a successful consume.
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: The one successful reveal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteResponse'
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/pastes/{slug}/raw:
    get:
      summary: Retrieve active plaintext content as text
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Plaintext content
          content:
            text/plain:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/live/config:
    get:
      summary: Retrieve public LiveBin limits
      description: Available only when live sharing is enabled. Returns no secrets, rate-limit settings, or operational topology.
      responses:
        '200':
          description: Configured room lifetime, content limits, and capacity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveConfigResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/live:
    post:
      summary: Create a temporary LiveBin room
      description: Room content is server-readable plaintext. A successful protected-room creation sets short-lived room-access and room-scoped creator-capability cookies; neither is returned in JSON or a URL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLiveRoomRequest' }
      responses:
        '201':
          description: Created room; its URL is unlisted and expires at expires_at.
          headers:
            Set-Cookie:
              description: HttpOnly SameSite=Strict room-access and creator-capability cookies, scoped to the room API path.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateLiveRoomResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/live/{slug}:
    get:
      summary: Bootstrap an active LiveBin room
      description: Returns the server-authoritative snapshot. Expired and missing rooms share the public 404 response. Protected rooms require the room-access cookie.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: X-0xbin-Live-Client-ID
          in: header
          required: false
          description: Stable live client ID. When supplied during resynchronization, the response identifies this client's recently accepted operations.
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Active room bootstrap and configured room limits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoomResponse' }
        '401': { $ref: '#/components/responses/PasswordRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/live/{slug}/unlock:
    post:
      summary: Unlock a password-protected active LiveBin room
      description: Valid credentials set a short-lived HttpOnly SameSite=Strict room-access cookie. The password is never returned or placed in the room URL.
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveUnlockRequest' }
      responses:
        '200':
          description: Authorized room bootstrap.
          headers:
            Set-Cookie:
              description: Room-access cookie scoped to the room API path.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoomResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidPassword' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/live/{slug}/ws:
    get:
      summary: Upgrade to the LiveBin WebSocket transport
      description: Requires an exact same-origin Origin header. Protected rooms require a valid room-access cookie before the HTTP upgrade; unauthorized requests receive HTTP 401 and never establish a WebSocket. The JSON WebSocket envelope is specified in docs/live-sharing-websocket.md.
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '101':
          description: WebSocket protocol switched after origin, expiry, capacity, and protected-room authorization checks.
        '401': { $ref: '#/components/responses/PasswordRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z]{1,128}$' }
  schemas:
    PlaintextPayload:
      type: object
      additionalProperties: false
      required: [version, content]
      properties:
        version: { type: integer, const: 1 }
        title: { type: string, description: At most 200 UTF-8 bytes. }
        language: { type: string, description: At most 64 UTF-8 bytes. }
        content: { type: string, minLength: 1, description: At most 1048576 UTF-8 bytes. }
    CreatePasteRequest:
      type: object
      additionalProperties: false
      required: [mode, payload, expiry]
      properties:
        mode: { type: string, enum: [plaintext, encrypted] }
        payload:
          oneOf:
            - $ref: '#/components/schemas/PlaintextPayload'
            - $ref: '#/components/schemas/CiphertextEnvelope'
        expiry: { type: string, enum: ['1h', '24h', '72h'] }
        burn_after_read: { type: boolean, default: false }
    CreatePasteResponse:
      type: object
      required: [slug, url, expires_at]
      properties:
        slug: { type: string }
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    LiveDocument:
      type: object
      additionalProperties: false
      required: [id, name, language, content, position, revision, snapshot_revision]
      properties:
        id: { type: string }
        name: { type: string, description: At most 64 UTF-8 bytes; unique in the active room. }
        language: { type: string }
        content: { type: string }
        position: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 0 }
        snapshot_revision: { type: integer, minimum: 0 }
    CreateLiveDocument:
      type: object
      additionalProperties: false
      required: [name, language, content]
      properties:
        name: { type: string, description: At most 64 UTF-8 bytes. }
        language: { type: string }
        content: { type: string, description: Bounded by max_document_bytes and max_bytes. }
    CreateLiveRoomRequest:
      type: object
      additionalProperties: false
      required: [documents]
      properties:
        password: { type: string, maxLength: 256, description: Optional shared room password. }
        documents:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateLiveDocument' }
    CreateLiveRoomResponse:
      type: object
      additionalProperties: false
      required: [slug, url, expires_at, password_required]
      properties:
        slug: { type: string }
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
        password_required: { type: boolean }
    LiveConfigResponse:
      type: object
      additionalProperties: false
      required: [max_bytes, max_document_bytes, max_tabs, max_writers, max_viewers, max_participants, room_lifetime_seconds]
      properties:
        max_bytes: { type: integer, minimum: 1, description: Aggregate UTF-8 content-byte limit across a room. }
        max_document_bytes: { type: integer, minimum: 1, description: Per-document UTF-8 content-byte limit. }
        max_tabs: { type: integer, minimum: 1 }
        max_writers: { type: integer, minimum: 1 }
        max_viewers: { type: integer, minimum: 0 }
        max_participants: { type: integer, minimum: 1 }
        room_lifetime_seconds: { type: integer, minimum: 1 }
    LiveParticipant:
      type: object
      additionalProperties: false
      required: [id, nickname, role, joined_at, color, current_tab, status, last_seen_at]
      properties:
        id: { type: string }
        nickname: { type: string }
        role: { type: string, enum: [writer, watch_only] }
        joined_at: { type: string, format: date-time }
        color: { type: string }
        current_tab: { type: string }
        status: { type: string, enum: [connected, connection_lost, offline] }
        last_seen_at: { type: string, format: date-time }
        cursor:
          type: object
          additionalProperties: false
          required: [document_id, revision, anchor, head]
          properties:
            document_id: { type: string }
            revision: { type: integer, minimum: 0 }
            anchor: { type: integer, minimum: 0 }
            head: { type: integer, minimum: 0 }
    LiveRoomResponse:
      type: object
      additionalProperties: false
      required: [slug, expires_at, password_required, metadata_revision, metadata_snapshot_revision, max_bytes, max_document_bytes, max_tabs, max_writers, max_viewers, max_participants, room_lifetime_seconds, creator, documents, participants]
      properties:
        slug: { type: string }
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
        password_required: { type: boolean }
        metadata_revision: { type: integer, minimum: 0 }
        metadata_snapshot_revision: { type: integer, minimum: 0 }
        max_bytes: { type: integer, minimum: 1, description: Aggregate UTF-8 content-byte limit across a room. }
        max_document_bytes: { type: integer, minimum: 1, description: Per-document UTF-8 content-byte limit. }
        max_tabs: { type: integer, minimum: 1 }
        max_writers: { type: integer, minimum: 1 }
        max_viewers: { type: integer, minimum: 0 }
        max_participants: { type: integer, minimum: 1 }
        room_lifetime_seconds: { type: integer, minimum: 1 }
        creator: { type: boolean }
        documents:
          type: array
          items: { $ref: '#/components/schemas/LiveDocument' }
        participants:
          type: array
          items: { $ref: '#/components/schemas/LiveParticipant' }
        accepted_operation_ids:
          type: array
          description: Recently accepted operation IDs for the client named by X-0xbin-Live-Client-ID. Used to acknowledge committed work during HTTP resynchronization.
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 128 }
    LiveUnlockRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, maxLength: 256 }
    PasteResponse:
      type: object
      required: [slug, is_encrypted, burn_after_read, expires_at, created_at]
      properties:
        slug: { type: string }
        payload: { $ref: '#/components/schemas/PlaintextPayload' }
        envelope: { $ref: '#/components/schemas/CiphertextEnvelope' }
        is_encrypted: { type: boolean }
        crypto_version: { type: integer, const: 1 }
        burn_after_read: { type: boolean }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    CiphertextEnvelope:
      type: object
      additionalProperties: false
      required: [version, algorithm, iv, ciphertext]
      properties:
        version: { type: integer, const: 1 }
        algorithm: { type: string, const: A256GCM }
        iv: { type: string, description: Base64url-encoded 12-byte IV. }
        ciphertext: { type: string, description: Base64url-encoded AES-GCM ciphertext with authentication tag. }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
  responses:
    InvalidRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PayloadTooLarge:
      description: Paste exceeds the size limit
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Missing, expired, deleted, or consumed paste
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: Temporary service failure
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Rate limit exceeded; response includes Retry-After
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PasswordRequired:
      description: The protected live room requires a valid room-access session.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InvalidPassword:
      description: The supplied live-room password is invalid.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: The WebSocket Origin is not permitted.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
